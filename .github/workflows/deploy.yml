name: Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: tag de l'image
        required: true
        type: string
      environment:
        description: cible
        type: choice
        options: [staging, production]
        default: staging
      test_local:
        description: Tester une image locale sur EC2
        type: boolean
        default: false
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read

    env:
      TAG: ${{ inputs.tag }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}

    steps:
      - name: Valider le tag
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Tag invalide"
            exit 1
          fi

      - name: Préparer SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Tester la connexion
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$SSH_USER@$SSH_HOST" \
            'whoami && docker ps'

      - name: Déployer sur EC2
        env:
          TEST_LOCAL: ${{ inputs.test_local }}
        run: |
          SCRIPT=deploy.sh

          if [ "$TEST_LOCAL" = "true" ]; then
            if [ "$TAG" != "s5-test-ko" ]; then
              echo "Le test local exige le tag s5-test-ko"
              exit 1
            fi
            SCRIPT=deploy-test-local.sh
          fi

          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$SSH_USER@$SSH_HOST" \
            "cd /opt/atlas && ./$SCRIPT '$TAG'"

      - name: Vérifier la version en service
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$SSH_USER@$SSH_HOST" \
            bash -s -- "$TAG" <<'REMOTE'
          set -euo pipefail
          cd /opt/atlas
          . ./image.env
          attendu="$IMAGE_NAME:$1"
          observe=$(docker inspect --format '{{.Config.Image}}' atlas-app)
          echo "Image en service : $observe"
          test "$observe" = "$attendu"
          test "$(cat current_tag)" = "$1"
          curl -fsS --max-time 5 http://localhost/api/health
          printf '\n'
          REMOTE

      - name: Vérifier l'accès HTTP public
        run: |
          URL="http://$SSH_HOST"
          curl -fsS --connect-timeout 5 --max-time 10 \
            "$URL/api/health"
          printf '\n'
          curl -fsS --connect-timeout 5 --max-time 10 \
            "$URL/api/calcul/ttc?prix=100&tva=20"
          printf '\n'

      - name: Effacer la clé du runner
        if: always()
        run: rm -f ~/.ssh/id_ed25519
